{% extends "base.html" %}

{% block title %}Catálogo | SoundMarket{% endblock %}

{% block content %}
    <h1>Catálogo</h1>
    <ul>
        {% for product in products %}
            <li>{{ product.name }}</li>
        {% empty %}
            <li>No hay productos disponibles en este momento.</li>
        {% endfor %}
    </ul>
{% endblock %}
