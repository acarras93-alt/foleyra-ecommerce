{% extends "base.html" %}

{% block title %}Iniciar sesión | Foleyra{% endblock %}

{% block content %}
    <h1>Iniciar sesión</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Iniciar sesión</button>
    </form>
{% endblock %}
